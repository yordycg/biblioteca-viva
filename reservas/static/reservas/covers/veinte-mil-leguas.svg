  <rect x="0" y="0" width="14" height="420" fill="#8fd3e8" opacity="0.5"/>
  <rect x="34" y="28" width="232" height="364" fill="none" stroke="#8fd3e8" stroke-width="1.5" opacity="0.7"/>
  <text x="150" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#8fd3e8">BIBLIOTECA VIVA</text>
